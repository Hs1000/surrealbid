# Render Blueprint: New → Blueprint → select this repo.
# Values marked `sync: false` are secrets you paste in the Render dashboard (copy them from your local .env).
services:
  - type: web
    name: surrealbid
    runtime: node
    # Free plan. Email goes through Brevo's HTTP API and images through Cloudinary, so neither
    # depends on SMTP ports or the (temporary) free-plan disk. Keep it awake with an uptime pinger
    # on /api/health; overdue auctions are also closed whenever the catalogue is loaded.
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "20"
      # Set this to the service URL Render gives you, e.g. https://surrealbid.onrender.com
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email via Brevo (brevo.com → SMTP & API → API Keys). MAIL_FROM must be a sender verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Images via Cloudinary (dashboard → API Keys → "API environment variable")
      - key: CLOUDINARY_URL
        sync: false
      # Add when you have them:
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
